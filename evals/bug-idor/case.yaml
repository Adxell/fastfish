schema_version: "1.0"
name: bug-idor
description: "Planted: getOrder no longer checks that the order belongs to the user (any user can read any order)."
tags: ["code", "security"]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Review my uncommitted changes with fresh eyes and check them against this project's own rules. Report what you find; do not fix anything."
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: ["Skill", "Agent", "Read", "Grep", "Glob", "Bash", "Write", "Edit"]
runs: 3
graders:
  - type: "llm"
    name: "flags-idor"
    criteria: "The response reports that getOrder in src/services/orderService.ts no longer checks that the order belongs to the requesting user, so one user can read another user's order (an authorization / IDOR / data exposure problem), and rates it as serious (blocker, major, high or critical)."
  - type: "tool_used"
    name: "fastfish-fired"
    tool: "Skill"
    input_match: "fastfish"
