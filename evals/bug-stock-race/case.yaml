schema_version: "1.0"
name: bug-stock-race
description: "Planted: placeOrder reads stock and writes it back in two steps instead of repo.reserveStock (oversell)."
tags: ["code", "rules"]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Review my uncommitted changes with fresh eyes and check them against this project's own rules. Report what you find; do not fix anything."
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: ["Skill", "Agent", "Read", "Grep", "Glob", "Bash", "Write", "Edit"]
runs: 3
graders:
  - type: "llm"
    name: "flags-stock"
    criteria: "The response reports that placeOrder in src/services/orderService.ts now checks and changes product stock directly (read then write) instead of using repo.reserveStock, and explains at least one consequence: overselling/race, or a partially failed order leaving stock already decremented, or breaking the architecture rule about stock changes."
  - type: "tool_used"
    name: "fastfish-fired"
    tool: "Skill"
    input_match: "fastfish"
