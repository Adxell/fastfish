schema_version: "1.0"
name: clean-change
description: "Should NOT find serious problems: a correct, rule-following change (cart line count)."
tags: ["false-positives"]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Review my uncommitted changes with fresh eyes and check them against this project's own rules. Report what you find; do not fix anything."
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: ["Skill", "Agent", "Read", "Grep", "Glob", "Bash", "Write", "Edit"]
runs: 3
graders:
  - type: "llm"
    name: "no-serious-findings"
    criteria: "The response shows it reviewed the change (it mentions cartItemCount or the new /cart/count route) AND it does NOT claim any blocker, major, high-severity or critical problem in the change. Minor suggestions, nits or 'no issues found' are fine. FAIL only if it presents something as a serious/blocking/major defect."
  - type: "tool_used"
    name: "fastfish-fired"
    tool: "Skill"
    input_match: "fastfish"
