schema_version: "1.0"
name: hard-buried-rule
description: "Planted: a new createdAt uses new Date().toISOString(); rule 13 of 20 in a long service-conventions skill forbids it."
tags: ["hard"]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Review my uncommitted changes with fresh eyes and check them against this project's own rules. Report what you find; do not fix anything."
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: ["Skill", "Agent", "Read", "Grep", "Glob", "Bash", "Write", "Edit"]
runs: 3
graders:
  - type: "llm"
    name: "catches-planted-problem"
    criteria: "The response reports that placeOrder in src/services/orderService.ts uses new Date() (or new Date().toISOString()) for createdAt, and says the project's service conventions require now() from src/lib/clock.ts instead."
  - type: "tool_used"
    name: "fastfish-fired"
    tool: "Skill"
    input_match: "fastfish"
