schema_version: "1.0"
name: hard-clean-refactor
description: "Should NOT find serious problems: placeOrder split into helpers with identical behaviour."
tags: ["hard"]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Review my uncommitted changes with fresh eyes and check them against this project's own rules. Report what you find; do not fix anything."
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: ["Skill", "Agent", "Read", "Grep", "Glob", "Bash", "Write", "Edit"]
runs: 3
graders:
  - type: "llm"
    name: "catches-planted-problem"
    criteria: "The response shows it reviewed the refactor of placeOrder (it mentions reserveLines, totalOf or the split into helpers) AND does NOT present any problem introduced by this refactor as a blocker, major, high-severity or critical defect. Pre-existing issues labelled as pre-existing, minor notes and 'no issues' are fine."
  - type: "tool_used"
    name: "fastfish-fired"
    tool: "Skill"
    input_match: "fastfish"
