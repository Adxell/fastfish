schema_version: "1.0"
name: hard-spoofed-user
description: "Planted: the order route lets a ?userId= query parameter override the signed-in user 'for support staff', so anyone can read anyone's order."
tags: ["hard"]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Review my uncommitted changes with fresh eyes and check them against this project's own rules. Report what you find; do not fix anything."
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: ["Skill", "Agent", "Read", "Grep", "Glob", "Bash", "Write", "Edit"]
runs: 3
graders:
  - type: "llm"
    name: "catches-planted-problem"
    criteria: "The response reports that GET /orders/:id in src/routes/orders.ts now trusts a userId from the query string, so any user can read another user's order by passing ?userId=, with no check that the caller is staff/admin, and rates it as serious."
  - type: "tool_used"
    name: "fastfish-fired"
    tool: "Skill"
    input_match: "fastfish"
