schema_version: "1.0"
name: hard-stale-cache
description: "Planted: cartTotalCents gets a per-user cache cleared in addToCart, but placeOrder (another file) clears the cart without clearing the cache, so totals are stale after an order."
tags: ["hard"]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Review my uncommitted changes with fresh eyes and check them against this project's own rules. Report what you find; do not fix anything."
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: ["Skill", "Agent", "Read", "Grep", "Glob", "Bash", "Write", "Edit"]
runs: 3
graders:
  - type: "llm"
    name: "catches-planted-problem"
    criteria: "The response reports that the new total cache in src/services/cartService.ts goes stale because the cart is also changed elsewhere (placeOrder in src/services/orderService.ts clears the cart, or product prices change) without clearing the cache, so cartTotalCents can return an old total."
  - type: "tool_used"
    name: "fastfish-fired"
    tool: "Skill"
    input_match: "fastfish"
