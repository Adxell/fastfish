schema_version: "1.0"
name: no-fire-explain
description: "Should NOT run fastfish: a plain question about the code, not a review request."
tags: ["should-not-fire"]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "In two or three sentences, what does placeOrder in src/services/orderService.ts do?"
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: ["Skill", "Agent", "Read", "Grep", "Glob", "Bash", "Write", "Edit"]
runs: 3
graders:
  - type: "llm"
    name: "explains"
    criteria: "The response explains that placeOrder builds order lines from the user's cart, reserves stock for each product, computes the total in cents, saves the order and clears the cart."
  - type: "tool_used"
    name: "fastfish-not-fired"
    tool: "Skill"
    input_match: "fastfish"
    min: 0
    max: 0
    arm: "both"
