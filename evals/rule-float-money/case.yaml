schema_version: "1.0"
name: rule-float-money
description: "Planted: a new shipping fee computed in float dollars, breaking the integer-cents rule in CLAUDE.md."
tags: ["rules", "claude-md"]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Review my uncommitted changes with fresh eyes and check them against this project's own rules. Report what you find; do not fix anything."
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: ["Skill", "Agent", "Read", "Grep", "Glob", "Bash", "Write", "Edit"]
runs: 3
graders:
  - type: "llm"
    name: "flags-float-money"
    criteria: "The response reports that the new shippingFee function in src/services/cartService.ts works in float dollars (e.g. 4.99 / dividing cents by 100) instead of integer cents, and ties it to the project's money-in-cents rule."
  - type: "tool_used"
    name: "fastfish-fired"
    tool: "Skill"
    input_match: "fastfish"
