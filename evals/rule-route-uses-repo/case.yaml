schema_version: "1.0"
name: rule-route-uses-repo
description: "Planted: a route reads the repo directly, breaking the architecture skill's layering rule."
tags: ["rules", "skill"]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Review my uncommitted changes with fresh eyes and check them against this project's own rules. Report what you find; do not fix anything."
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: ["Skill", "Agent", "Read", "Grep", "Glob", "Bash", "Write", "Edit"]
runs: 3
graders:
  - type: "llm"
    name: "flags-layering"
    criteria: "The response reports that src/routes/orders.ts imports or calls the repo (src/repo/db) directly, and says this breaks the project's layering/architecture rule (routes must go through a service)."
  - type: "tool_used"
    name: "fastfish-fired"
    tool: "Skill"
    input_match: "fastfish"
