# Template only. `ff setup` creates these for you from environment variables or prompts.
# If you apply this by hand, copy it outside the repo first and never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: claude-auth
  namespace: fastfish-agents
type: Opaque
stringData:
  # Set ONE of these.
  CLAUDE_CODE_OAUTH_TOKEN: ""   # from `claude setup-token` (uses your Pro/Max plan)
  # ANTHROPIC_API_KEY: ""       # pay-per-use API key
---
apiVersion: v1
kind: Secret
metadata:
  name: git-auth
  namespace: fastfish-agents
type: Opaque
stringData:
  GH_TOKEN: ""   # fine-grained token: Contents read/write + Pull requests read/write on the repos agents use
